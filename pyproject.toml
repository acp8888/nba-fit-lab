[project]
name = "nba-fit-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb", 
    "boto3", 
    "pyarrow", 
    "polars",
]

[dependency-groups]
analysis = [
    "marimo", 
    "scikit-learn", 
    "matplotlib",
    "altair", 
    "statsmodels",
]

dev = [
    "pre-commit",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_fit"]